<body>
<canvas id="game"></canvas>
<div id="camwrap">
  <video id="cam" playsinline muted></video>
  <div id="camlabel">YOU</div>
</div>
<div id="hud">SCORE <span id="score">0</span></div>
<div id="hudr">BEST <span id="best">0</span></div>
<div id="msg"></div>
<div id="pose">POSE: --</div>
<div id="rotate">&#8635;<br><br>ROTATE YOUR IPAD<br>SIDWAYS TO PLAY</div>
<div id="ui">
  <h1>BODY RUNNER</h1>
  <div class="sub">THE DINO GAME, BUT YOU ARE THE CONTROLLER</div>
  <div class="howto">
    <b>JUMP</b> in real life to jump &nbsp;&middot;&nbsp; <b>SQUAT</b> to slide under purple barriers<br>
    Stand back so your whole body is in frame.<br>
    No camera? <b>SPACE</b> jumps, <b>&#8595;</b> ducks.
  </div>
  <button id="bigbtn">&#9654; TAP TO START</button>
  <div id="status"></div>
</div>
<script>
(function(){
"use strict";
var $=function(id){return document.getElementById(id);};
var canvas=$("game"),ctx=canvas.getContext("2d");
var video=$("cam");
function fit(){canvas.width=window.innerWidth;canvas.height=window.innerHeight;}
window.addEventListener("resize",fit);fit();

var MP_URL="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/+esm";
var VISION_URL="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm";
var POSE_URL="https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/task.tfm";
function lerp(a,b,t){return a+(b-a)*t;}

/* ================= body -> controls =================
   hips (23,24) drive everything. y is down in image coords.
   Calibrate a standing baseline, then:
   - JUMP: hip velocity upward spikes past threshold
   - DUCK: hips sink below baseline (with hysteresis) */
var BC={sy:null,sv:0,py:null,base:null,cool:0,duck:false};
var JUMP_VEL=0.011,DUCK_ON=0.10,DUCK_OFF=0.05;
function resetBody(){BC.sy=null;BC.sv=0;BC.py=null;BC.base=null;BC.cool=0;BC.duck=false;}
function hipY(lm){return (lm[23].y+lm[24].y)/2;}
function bodyVisible(lm){var v23=lm[23].visibility==null?1:lm[23].visibility,
  v24=lm[24].visibility==null?1:lm[24].visibility;return v23>0.4&&v24>0.4;}
function updateBody(lm,now){
  // returns "jump" | "duck" | "stand" | "hidden"
  if(!bodyVisible(lm))return "hidden";
  var y=hipY(lm);
  BC.sy=BC.sy==null?y:lerp(BC.sy,y,0.5);
  var v=BC.py==null?0:BC.py-BC.sy; // >0 = moving up
  BC.py=BC.sy;
  BC.sv=lerp(BC.sv,v,0.4);
  if(BC.base==null)return "stand"; // still calibrating
  if(now<BC.cool){BC.duck=(BC.sy-BC.base)>DUCK_OFF;return BC.duck?"duck":"stand";}
  if(!BC.duck&&BC.sv>JUMP_VEL){BC.cool=now+450;BC.duck=false;return "jump";}
  if(!BC.duck&&(BC.sy-BC.base)>DUCK_ON)BC.duck=true;
  else if(BC.duck&&(BC.sy-BC.base)<DUCK_OFF)BC.duck=false;
  return BC.duck?"duck":"stand";
}
function calibrate(lm){ // feed standing frames, returns true when baseline locked
  if(!bodyVisible(lm))return false;
  var y=hipY(lm);
  BC.base=BC.base==null?y:lerp(BC.base,y,0.2);
  return true;
}

/* ================= game ================= */
var G={state:"menu",score:0,best:+(window.localStorage.getItem("br_best")||0),
  speed:6,dist:0,spawnIn:0,obs:[],parts:[],
  p:{x:0,y:0,vy:0,duck:false,air:false},ground:0,shake:0,msgT:0};
$("best").textContent=G.best;
function groundY(){return canvas.height-90;}
function reset(){
  G.score=0;G.dist=0;G.speed=6;G.spawnIn=90;G.obs=[];G.parts=[];
  G.p={x:Math.min(180,canvas.width*0.2),y:0,vy:0,duck:false,air:false};
  G.ground=groundY();
}
function jump(){
  if(G.state!=="play")return;
  if(!G.p.air){G.p.vy=-16.5;G.p.air=true;G.p.duck=false;burst(G.p.x,groundY()-10,10,"#00f0ff");}
}
function setDuck(d){if(G.state==="play"&&!G.p.air)G.p.duck=d;}
function burst(x,y,n,col){
  for(var i=0;i<n;i++)G.parts.push({x:x,y:y,vx:(Math.random()-0.5)*6,vy:-Math.random()*5-1,
    life:1,col:col,r:2+Math.random()*3});
}
function spawn(){
  var r=Math.random();
  var w=34+Math.random()*22;
  if(r<0.55){ // low barrier — JUMP
    var h=44+Math.random()*26;
    G.obs.push({x:canvas.width+40,w:w,h:h,y:groundY()-h,duck:false});
  }else{ // high barrier — DUCK under it
    var gapTop=groundY()-118,hh=44;
    G.obs.push({x:canvas.width+40,w:w,h:hh,y:gapTop,duck:true});
  }
}
function rectsHit(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}
function playerBox(){
  var h=G.p.duck?34:74,w=34;
  return {x:G.p.x,y:groundY()-G.p.y-h,w:w,h:h};
}
function die(){
  G.state="dead";G.shake=14;burst(G.p.x,groundY()-G.p.y-40,26,"#ff5b5b");
  if(G.score>G.best){G.best=G.score;window.localStorage.setItem("br_best",G.best);$("best").textContent=G.best;}
  showMsg("WIPED OUT — JUMP TO RETRY",1e9);
}
function showMsg(t,ms){var m=$("msg");m.textContent=t;m.style.display="block";
  clearTimeout(G.msgT);if(ms<1e9)G.msgT=setTimeout(function(){m.style.display="none";},ms);}
function step(){
  // physics
  if(G.p.air){
    G.p.vy+=0.9;G.p.y+=G.p.vy;
    if(G.p.y<=0){G.p.y=0;G.p.vy=0;G.p.air=false;burst(G.p.x,groundY()-6,8,"#2a7a8a");}
  }
  // obstacles
  G.spawnIn--;
  if(G.spawnIn<=0){spawn();G.spawnIn=Math.max(46,150-G.speed*6)+Math.random()*70;}
  var pb=playerBox();
  for(var i=0;i<G.obs.length;i++){
    var o=G.obs[i];
    o.x-=G.speed;
    if(rectsHit(pb,o)){die();break;}
  }
  G.obs=G.obs.filter(function(o){return o.x+o.w>-60;});
  // particles
  for(var j=0;j<G.parts.length;j++){var p=G.parts[j];p.x+=p.vx;p.y+=p.vy;p.vy+=0.25;p.life-=0.03;}
  G.parts=G.parts.filter(function(p){return p.life>0;});
  // score + difficulty
  G.dist+=G.speed;G.score=Math.floor(G.dist/10);
  G.speed=Math.min(14,6+G.score*0.012);
  $("score").textContent=G.score;
  if(G.shake>0)G.shake*=0.88;
}
function draw(){
  ctx.save();
  if(G.shake>0.5)ctx.translate((Math.random()-0.5)*G.shake,(Math.random()-0.5)*G.shake);
  // bg
  var gr=ctx.createLinearGradient(0,0,0,canvas.height);
  gr.addColorStop(0,"#020608");gr.addColorStop(0.7,"#04141c");gr.addColorStop(1,"#020608");
  ctx.fillStyle=gr;ctx.fillRect(-20,-20,canvas.width+40,canvas.height+40);
  // scrolling grid floor
  var gy=groundY(),off=(G.dist%60);
  ctx.strokeStyle="rgba(0,240,255,.18)";ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(0,gy);ctx.lineTo(canvas.width,gy);
  ctx.strokeStyle="rgba(0,240,255,.5)";ctx.lineWidth=2;ctx.stroke();
  ctx.strokeStyle="rgba(0,240,255,.12)";ctx.lineWidth=1;ctx.beginPath();
  var x,y;
  for(x=-off;x<canvas.width;x+=60){ctx.moveTo(x,gy);ctx.lineTo(x-40,canvas.height);}
  for(y=gy+24;y<canvas.height;y+=28){ctx.moveTo(0,y);ctx.lineTo(canvas.width,y);}
  ctx.stroke();
  // stars
  ctx.fillStyle="rgba(160,220,235,.5)";
  for(var i=0;i<40;i++){
    var sx=((i*197.3-G.dist*0.3)%(canvas.width+40)+(canvas.width+40))%(canvas.width+40)-20;
    ctx.fillRect(sx,(i*89.7)%(gy-40),2,2);
  }
  // obstacles
  for(var k=0;k<G.obs.length;k++){
    var o=G.obs[k];
    ctx.save();ctx.shadowColor=o.duck?"#b44dff":"#ff5b5b";ctx.shadowBlur=16;
    ctx.fillStyle=o.duck?"rgba(180,77,255,.85)":"rgba(255,91,91,.85)";
    ctx.fillRect(o.x,o.y,o.w,o.h);
    ctx.fillStyle="rgba(255,255,255,.25)";ctx.fillRect(o.x,o.y,o.w,5);
    ctx.restore();
  }
  // player — glowing runner
  var pb=playerBox(),px=pb.x+pb.w/2,pyb=pb.y+pb.h;
  ctx.save();ctx.shadowColor="#00f0ff";ctx.shadowBlur=22;
  ctx.fillStyle="#00f0ff";
  var bob=G.p.air?0:Math.sin(performance.now()*0.02)*3;
  if(G.p.duck){ctx.beginPath();ctx.ellipse(px,pyb-17,26,17,0,0,Math.PI*2);ctx.fill();}
  else{
    ctx.beginPath();ctx.arc(px,pyb-52+bob*0.3,13,0,Math.PI*2);ctx.fill(); // head
    ctx.fillRect(px-9,pyb-42+bob*0.3,18,30); // torso
    var lp=Math.sin(performance.now()*0.025)*10;
    ctx.fillRect(px-11,pyb-14,8,14+lp*0.3);ctx.fillRect(px+3,pyb-14,8,14-lp*0.3); // legs
  }
  ctx.restore();
  // trail
  if(G.state==="play"&&G.speed>8){
    ctx.strokeStyle="rgba(0,240,255,.25)";ctx.lineWidth=3;
    for(var t=0;t<3;t++){ctx.beginPath();ctx.moveTo(pb.x-10-t*22,pyb-30);ctx.lineTo(pb.x-30-t*22,pyb-30);ctx.stroke();}
  }
  // particles
  for(var q=0;q<G.parts.length;q++){var pt=G.parts[q];ctx.globalAlpha=Math.max(0,pt.life);ctx.fillStyle=pt.col;
    ctx.beginPath();ctx.arc(pt.x,pt.y,pt.r,0,Math.PI*2);ctx.fill();}
  ctx.globalAlpha=1;
  ctx.restore();
}

/* ================= start flow =================
   Pressing START always does something:
   - camera + tracker load  -> full body mode
   - anything fails          -> keyboard/touch mode, no dead end */
var landmarker=null,lastT=0,calT=0,calN=0,cdT=0,noticeT=0,camMode=false,started=false;
function setStatus(t){$("status").textContent=t||"";}
$("bigbtn").onclick=function(){start();};
function withTimeout(p,ms){
  return Promise.race([p,new Promise(function(_,rej){
    setTimeout(function(){rej(new Error("timeout"));},ms);})]);
}
async function start(){
  if(started)return;started=true;
  var btn=$("bigbtn");btn.disabled=true;setStatus("STARTING CAMERA…");
  var gum=navigator.mediaDevices&&navigator.mediaDevices.getUserMedia;
  if(!gum){
    keyboardMode("THIS BROWSER CAN'T USE THE CAMERA — KEYBOARD MODE");
    return;
  }
  var stream=null;
  try{
    stream=await withTimeout(
      navigator.mediaDevices.getUserMedia({video:{facingMode:"user"},audio:false}),8000);
  }catch(e){
    var msg="CAMERA BLOCKED — KEYBOARD MODE";
    if(window.navigator.standalone===true)
      msg="HOME SCREEN APPS CAN'T USE THE CAMERA ON THIS IPAD — OPEN THE LINK IN SAFARI INSTEAD";
    keyboardMode(msg);
    return;
  }
  video.srcObject=stream;video.muted=true;
  try{await video.play();}catch(e){/* play() best-effort on iOS */}
  setStatus("LOADING BODY TRACKER…");
  try{
    var mp=await withTimeout(import(MP_URL),20000);
    var vision=await withTimeout(mp.FilesetResolver.forVisionTasks(VISION_URL),20000);
    try{
      landmarker=await withTimeout(mp.PoseLandmarker.createFromOptions(vision,{
        baseOptions:{modelAssetPath:POSE_URL,delegate:"GPU"},runningMode:"VIDEO",numPoses:1}),20000);
    }catch(e){
      landmarker=await withTimeout(mp.PoseLandmarker.createFromOptions(vision,{
        baseOptions:{modelAssetPath:POSE_URL,delegate:"CPU"},runningMode:"VIDEO",numPoses:1}),20000);
    }
  }catch(e){
    // tracker failed — play with keyboard instead of stranding the user
    try{if(stream){var tr=stream.getTracks();for(var i=0;i<tr.length;i++)tr[i].stop();}}catch(e2){}
    keyboardMode("BODY TRACKER WOULDN'T LOAD — KEYBOARD MODE");
    return;
  }
  // full body mode
  camMode=true;
  $("camwrap").style.display="block";
  $("ui").classList.add("hidden");
  resetBody();reset();
  G.state="calibrate";calT=performance.now();calN=0;
  showMsg("STAND STILL…",1e9);
  requestAnimationFrame(loop);
}
function keyboardMode(msg){
  camMode=false;
  $("camwrap").style.display="none";
  $("ui").classList.add("hidden");
  $("pose").textContent="MODE: KEYBOARD/TOUCH — SPACE JUMPS, ARROW-DOWN DUCKS";
  resetBody();reset();
  G.state="notice";noticeT=performance.now();
  showMsg(msg||"KEYBOARD MODE",1e9);
  requestAnimationFrame(loop);
}
var lastPose="--",poseT=0;
function loop(){
  requestAnimationFrame(loop);
  var now=performance.now();
  var lm=null;
  if(camMode&&video.readyState>=2&&now>lastT){
    lastT=now;
    try{var r=landmarker.detectForVideo(video,now);lm=(r.landmarks&&r.landmarks[0])||null;}
    catch(e){lm=null;}
  }
  if(G.state==="calibrate"){
    if(lm&&calibrate(lm))calN++;
    if(now-calT>2200&&calN>20){G.state="countdown";cdT=now;showMsg("3",1e9);}
    else if(now-calT>2200){
      if(now-calT>6000)showMsg("STEP BACK — GET YOUR WHOLE BODY IN FRAME",1e9);
      else{calT=now;calN=0;} // not visible — keep waiting
    }
    draw();return;
  }
  if(G.state==="notice"){
    if(now-noticeT>2200){G.state="countdown";cdT=now;showMsg("3",1e9);}
    draw();return;
  }
  if(G.state==="countdown"){
    var s=3-Math.floor((now-cdT)/700);
    if(s<=0){G.state="play";$("msg").style.display="none";reset();}
    else showMsg(String(s),1e9);
    draw();return;
  }
  if(camMode&&lm){
    var cmd=updateBody(lm,now);
    if(now-poseT>200){poseT=now;lastPose=cmd.toUpperCase();$("pose").textContent="POSE: "+lastPose;}
    if(G.state==="play"){
      if(cmd==="jump")jump();
      else if(cmd==="duck")setDuck(true);
      else if(cmd==="stand")setDuck(false);
    }else if(G.state==="dead"&&cmd==="jump"){ // jump to retry
      $("msg").style.display="none";resetBody();reset();G.state="play";
    }
  }else if(camMode&&now-poseT>500){$("pose").textContent="POSE: STEP INTO FRAME";}
  if(G.state==="play")step();
  draw();
}
// keyboard fallback (also handy for testing)
window.addEventListener("keydown",function(e){
  if(e.code==="Space"){e.preventDefault();
    if(G.state==="menu"){start();return;}
    if(G.state==="dead"){$("msg").style.display="none";resetBody();reset();G.state="play";}
    else jump();}
  if(e.code==="ArrowDown")setDuck(true);
});
window.addEventListener("keyup",function(e){if(e.code==="ArrowDown")setDuck(false);});
canvas.addEventListener("pointerdown",function(){
  if(G.state==="dead"){$("msg").style.display="none";resetBody();reset();G.state="play";}
});
// touch fallback for old iPads (no PointerEvent)
canvas.addEventListener("touchstart",function(e){e.preventDefault();
  if(G.state==="dead"){$("msg").style.display="none";resetBody();reset();G.state="play";}
},{passive:false});
// rotate hint for phones/tablets held upright
function checkRotate(){$("rotate").style.display=(window.innerHeight>window.innerWidth&&window.innerWidth<900)?"flex":"none";}
window.addEventListener("resize",checkRotate);checkRotate();
draw(); // menu backdrop
})();
</script>
